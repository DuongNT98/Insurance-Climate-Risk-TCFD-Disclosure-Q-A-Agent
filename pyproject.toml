[project]
name = "ins-c2-013"
version = "0.1.0"
description = "Insurance Climate Risk & TCFD Disclosure Q&A Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — a local stub package on PYTHONPATH for
# stub-era repos, or installed from the package registry for wheel-era repos
# (see the dual-mode test job in the CI pipeline config). Pinning it here would
# make `pip install -e .` fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# agenticstar-agentcore ships framework/shared with no py.typed marker (PEP 561) —
# every "from framework..."/"from shared..." import is import-untyped, which then
# cascades into "Class cannot subclass FunctionNode (has type Any)" under strict
# mode's disallow_subclassing_any for every node/graph in this repo. Root cause is
# SDK-side (request:coe candidate); these overrides are the verified local fix
# (confirmed green on real CI, Python 3.11.16 runner — see
# logs/tooling-improvement-log.md "type-check (mypy strict) fails fleet-wide").
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# Every node/graph in this repo subclasses an Any-typed framework base class
# (framework ships no py.typed marker, see above) — strict mode's subclass check
# has no real signal to give here without SDK-side stubs.
[[tool.mypy.overrides]]
module = "src.*"
disallow_subclassing_any = false
